[workspace]
resolver = "2"
members = [
    "crates/hashit-core",
    "crates/hashit-extract",
    "crates/hashit",
    "crates/hashit-idx",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

# Shared dependency versions. Member crates opt in with `workspace = true`,
# so the version/feature set is defined once here.
[workspace.dependencies]
anyhow = "1"
blake3 = "1.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
hex = "0.4"
notify = "6.1"
notify-debouncer-full = "0.3"
prost = "0.13"
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tonic = "0.12"
tonic-build = "0.12"
protoc-bin-vendored = "3"
walkdir = "2.5"

# The metadata/image crates live behind the workspace too, but only
# hashit-extract pulls them.
exiftool_rs = { package = "exiftool-rs", git = "ssh://git@github.com/dougwa/exiftool-rs.git", rev = "06b04462b9d582ac6373ba3774614e6ce3bf75ae" }
magick-core = { git = "ssh://git@github.com/dougwa/magick-rs.git", rev = "1f79a00557922e15952b2bf9f3ca9fae93f17a40" }
magick-codecs = { git = "ssh://git@github.com/dougwa/magick-rs.git", rev = "1f79a00557922e15952b2bf9f3ca9fae93f17a40" }

hashit-core = { path = "crates/hashit-core" }
hashit-extract = { path = "crates/hashit-extract" }

[profile.release]
opt-level = 3
lto = true
