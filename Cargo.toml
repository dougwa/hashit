[package]
name = "hashit"
version = "0.1.0"
edition = "2021"
description = "Maintain per-directory .hashit manifests of file hashes and stats, with inventory and watch modes."
license = "MIT"

[[bin]]
name = "hashit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.5"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
notify = "6.1"
notify-debouncer-full = "0.3"
rayon = "1.10"
glob = "0.3"
anyhow = "1"
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
console = "0.15"
uuid = { version = "1", features = ["v4"], optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
exiftool_rs = { package = "exiftool-rs", git = "ssh://git@github.com/dougwa/exiftool-rs.git", rev = "dcd8462ea0f74d06df6d07a02072110fb0964044", optional = true }
magick-core = { git = "ssh://git@github.com/dougwa/magick-rs.git", rev = "1f79a00557922e15952b2bf9f3ca9fae93f17a40", optional = true }
magick-codecs = { git = "ssh://git@github.com/dougwa/magick-rs.git", rev = "1f79a00557922e15952b2bf9f3ca9fae93f17a40", optional = true }

[features]
default = ["extract"]
# The metadata subsystem: global SQLite index, drive registry, extractors,
# thumbnails. Gated so the core CLI can build without these heavier deps.
extract = ["dep:uuid", "dep:rusqlite", "dep:exiftool_rs", "dep:magick-core", "dep:magick-codecs"]

[profile.release]
opt-level = 3
lto = true
