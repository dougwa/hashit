[package]
name = "hashit"
version = "0.1.0"
edition = "2021"
description = "Maintain per-directory .hashit manifests of file hashes and stats, with inventory and watch modes."
license = "MIT"

[[bin]]
name = "hashit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.5"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
notify = "6.1"
notify-debouncer-full = "0.3"
rayon = "1.10"
glob = "0.3"
anyhow = "1"
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
console = "0.15"

[profile.release]
opt-level = 3
lto = true
